<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>午餐菜單上傳系統</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; line-height: 1.6; }
    textarea { width: 100%; height: 200px; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; }
    button:hover { background: #0056b3; }
    .holiday-box { margin-top: 30px; padding: 15px; border: 1px solid #ffcccc; background: #fff5f5; border-radius: 8px; }
    .holiday-box input { padding: 8px; font-size: 16px; margin-right: 10px; width: 150px; }
    .holiday-box button { background: #ff4444; }
    .holiday-box button:hover { background: #cc0000; }
  </style>
</head>
<body>

  <h2>🍱 午餐菜單上傳系統</h2>
  <p>請將 Excel 上的菜單資料（日期、葷食、素食）複製並貼在下方：</p>
  <textarea id="menuInput" placeholder="請直接從 Excel 複製貼上，格式範例：&#10;10/01  葷食菜色  素食菜色&#10;10/02  葷食菜色  素食菜色"></textarea><br>
  <button onclick="uploadMenu()">轉換並儲存/上傳</button>

  <div class="holiday-box">
    <h3 style="margin-top: 0;">🚨 臨時放假 / 停發設定</h3>
    <input type="text" id="holidayDate" placeholder="例如: 10/23" />
    <button onclick="setHoliday()">標記休假並停發</button>
  </div>

  <script>
    // 您的專屬 Worker 網址
    const WORKER_URL = 'https://lunchbot.wpeanut001.workers.dev';

    // 功能 1：上傳整個月的菜單
    async function uploadMenu() {
      const text = document.getElementById('menuInput').value.trim();
      if (!text) return alert('請貼上菜單資料！');

      // 解析 Excel 貼上的資料 (按行與 Tab 鍵分隔)
      const rows = text.split('\n');
      const dataArray = [];
      for (const row of rows) {
        const cols = row.split('\t');
        if (cols.length >= 3) {
          dataArray.push([cols[0].trim(), cols[1].trim(), cols[2].trim()]);
        }
      }

      if (dataArray.length === 0) {
        return alert('解析失敗，請確認格式是否正確 (需包含：日期、葷食、素食)。');
      }

      try {
        const response = await fetch(`${WORKER_URL}/save-menu`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: dataArray })
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          alert(`✅ 上傳成功！\n${result.message}`);
          document.getElementById('menuInput').value = ''; // 成功後清空輸入框
        } else {
          alert('上傳失敗：' + result.message);
        }
      } catch (error) {
        alert('上傳發生錯誤，請檢查網路連線。');
      }
    }

    // 功能 2：設定單日臨時休假
    async function setHoliday() {
      const dateStr = document.getElementById('holidayDate').value.trim();
      if (!dateStr) return alert("請輸入日期，例如 10/23");

      try {
        const response = await fetch(`${WORKER_URL}/save-single-holiday`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: [[dateStr, "臨時休假", "臨時休假"]] })
        });
        
        const result = await response.json();
        if (result.status === 'success') {
          alert(`✅ 已成功將 ${dateStr} 標記為休假，當日將自動跳過推播！`);
          document.getElementById('holidayDate').value = ''; // 成功後清空輸入框
        } else {
          alert('設定失敗：' + result.message);
        }
      } catch (error) {
        alert("設定發生錯誤，請檢查網路連線。");
      }
    }
  </script>

</body>
</html>
