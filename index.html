<div style="margin-top: 20px; padding: 15px; border: 1px solid #ffcccc; background: #fff5f5; border-radius: 8px;">
  <h3 style="margin-top: 0;">🚨 臨時放假 / 停發設定</h3>
  <input type="text" id="holidayDate" placeholder="例如: 10/23" style="padding: 5px;" />
  <button onclick="setHoliday()" style="padding: 5px 10px; background: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer;">標記休假並停發</button>
</div>

<script>
async function setHoliday() {
  const dateStr = document.getElementById('holidayDate').value.trim();
  if (!dateStr) return alert("請輸入日期，例如 10/23");

  // 替換為您的 Cloudflare Worker 網址
  const workerUrl = '您的_Worker_網址/save-single-holiday'; 

  try {
    const response = await fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: [[dateStr, "臨時休假", "臨時休假"]] })
    });
    
    const result = await response.json();
    if (result.status === 'success') {
      alert(`✅ 已成功將 ${dateStr} 標記為休假，當日將自動跳過推播！`);
    }
  } catch (error) {
    alert("設定失敗，請檢查 API 網址或網路狀態。");
  }
}
</script>
